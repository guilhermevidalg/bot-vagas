    "estágio projetos TI",
    "estágio governança de TI",
    # Inglês (multinacionais)
    "intern IT",
    "intern data",
    "intern developer",
    "internship technology",
]
limite_por_pagina = 100   # quanto pedimos; a API pode devolver menos
max_paginas = 3           # trava de segurança contra loop infinito
pausa_segundos = 1        # espera entre requisições

[filtro]
# Comparação feita em minúsculas e sem acento ("ESTÁGIO" = "estagio")
palavras_chave = ["estagio", "estagiario", "estagiaria", "intern", "internship"]
palavras_excluidas = ["senior", "pleno", "trainee", "jovem aprendiz"]

[localizacao]
# Remota: aceita de qualquer lugar. Presencial/híbrida: só nestes estados.
estados_permitidos = ["Rio de Janeiro", "RJ"]
aceitar_local_nao_informado = true
