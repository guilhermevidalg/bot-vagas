    "estágio análise de dados",
    "estágio analytics",
    "estágio BI",
    "estágio business intelligence",
    "estágio power BI",
    "estágio SQL",
    "estágio ciência de dados",
    "estágio data science",
    "estágio engenharia de dados",
    "estágio inteligência artificial",
    "estágio machine learning",
    "estágio estatística",
    "estágio planejamento comercial",
    "estágio inteligência de mercado",
    # Automação
    "estágio automação",
    "estágio automação de processos",
    "estágio RPA",
    "estágio low-code",
    "estágio processos",
    # Infra, qualidade e segurança
    "estágio suporte",
    "estágio suporte técnico",
    "estágio service desk",
